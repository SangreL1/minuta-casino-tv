<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Icono Cubo Isométrico 3D -->
  <g transform="translate(10, 10)">
    <!-- Cara Superior -->
    <polygon points="30,5 55,19 30,33 5,19" fill="#143472" />
    <!-- Cara Izquierda (Naranja) -->
    <polygon points="5,22 30,36 30,64 5,50" fill="#E66519" />
    <!-- Cara Derecha (Azul) -->
    <polygon points="30,36 55,22 55,50 30,64" fill="#2963B5" />
  </g>
  <!-- Texto PROMET -->
  <text x="80" y="55" font-family="'Segoe UI', 'Carlito', 'Calibri', Arial, sans-serif" font-size="44" font-weight="900" fill="#112C5C" letter-spacing="1">PROMET</text>
</svg>
